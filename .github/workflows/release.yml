name: Build and Release HD Map Assets

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create archives
        run: |
          mkdir -p dist

          for dir in */; do
            [ -d "$dir" ] || continue
            name=$(basename "$dir")
            zip -r -X "dist/${name}.zip" "$dir"
          done

      - name: Generate checksums
        run: |
          cd dist
          sha256sum *.zip > checksums.txt || true

      - name: Generate changelog (from last tag)
        run: |
          PREV_TAG=$(git tag --sort=-creatordate | grep -v "^${{ github.ref_name }}$" | head -n1)
          if [ -z "$PREV_TAG" ]; then
            BODY="Initial release."
          else
            BODY=$(git log --pretty=format:"- %s" "${PREV_TAG}..HEAD")
          fi
          echo "$BODY" > dist/CHANGELOG.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: HD Map Assets ${{ github.ref_name }}
          body_path: dist/CHANGELOG.md
          files: |
            dist/*.zip
            dist/checksums.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
